[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-generated-eval-workbench"
version = "0.1.0"
description = "A multiprocess visual workbench for image generation pipelines."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "python-multipart>=0.0.9",
  "packaging>=22",
  "markdown-it-py>=3.0,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

